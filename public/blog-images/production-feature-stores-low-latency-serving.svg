        <rect x="384" y="490" width="66" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
        <text x="397" y="506" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7DD3FC">• Redis</text>
        

