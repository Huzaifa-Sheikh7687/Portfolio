        <text x="450" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">STABLE</text>

        <!-- Metrics Content -->
        <g transform="translate(20, 20)">
            
        <g transform="translate(30, 110)">
            <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">ks-p-value</text>
            <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#34D399" text-anchor="end">0.42 (Healthy)</text>
            <line x1="0" y1="18" x2="360" y2="18" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
        </g>
        
        <g transform="translate(30, 164)">
            <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">baseline-psi</text>
            <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#34D399" text-anchor="end">0.038</text>
            <line x1="0" y1="18" x2="360" y2="18" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
        </g>
        
        <g transform="translate(30, 218)">
            <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">monitoring-window</text>
            <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#38BDF8" text-anchor="end">Rolling 24h</text>
            <line x1="0" y1="18" x2="360" y2="18" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
        </g>
        
        <g transform="translate(30, 272)">
            <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">retrain-trigger-status</text>
            <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#C084FC" text-anchor="end">Idle / Stable</text>
            <line x1="0" y1="18" x2="360" y2="18" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
        </g>
        
        </g>
    </g>

    <!-- Footer Divider & Meta Details -->
    <line x1="60" y1="570" x2="1140" y2="570" stroke="#1E293B" stroke-width="1" />
    <text x="60" y="595" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B" letter-spacing="1.5">DATA SCIENCE &amp; ML SYSTEMS</text>
    <text x="600" y="595" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Huzaifa Sheikh • Engineering Deep-Dive</text>
    <text x="1140" y="595" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="end">huzaifa-sheikh-portfolio.vercel.app</text>
</svg>