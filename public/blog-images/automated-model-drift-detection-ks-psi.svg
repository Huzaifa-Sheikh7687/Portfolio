    <text x="1140" y="40" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">PRODUCTION DEPLOYED</text>

    <!-- Main Title & Subtitle -->
    <text x="60" y="95" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="url(#titleGrad)">Automated Model Drift</text>
    <text x='60' y='135' font-family="'Space Grotesk', sans-serif" font-weight='700' font-size='34' fill='url(#titleGrad)'>&amp; Covariate Shift Detection</text>
    <text x="60" y="170" font-family="'Inter', sans-serif" font-size="15" fill="#94A3B8">Statistical monitoring with Kolmogorov-Smirnov test and Population Stability Index.</text>

    <!-- Left Side: Architectural Cards -->
    
        <g transform="translate(60, 230)">
            <rect width="480" height="56" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1.2"/>
            <rect x="12" y="12" width="32" height="32" rx="8" fill="#1E293B" fill-opacity="0.6"/>
            <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" text-anchor="middle">📊</text>
            <text x="56" y="27" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#F8FAFC">KS-Test for Continuous Features</text>
            <text x="56" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Detects empirical cumulative distribution divergence at p &lt; 0.01.</text>
        </g>
        
        <g transform="translate(60, 298)">
            <rect width="480" height="56" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1.2"/>
            <rect x="12" y="12" width="32" height="32" rx="8" fill="#1E293B" fill-opacity="0.6"/>
            <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" text-anchor="middle">📈</text>
            <text x="56" y="27" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#F8FAFC">Population Stability Index (PSI)</text>
            <text x="56" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Quantifies categorical shift: PSI &gt; 0.25 triggers retraining.</text>
        </g>
        
        <g transform="translate(60, 366)">
            <rect width="480" height="56" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1.2"/>
            <rect x="12" y="12" width="32" height="32" rx="8" fill="#1E293B" fill-opacity="0.6"/>
            <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" text-anchor="middle">🔄</text>
            <text x="56" y="27" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#F8FAFC">Automated Retraining Loop</text>
            <text x="56" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Airflow DAG triggered to backfill recent production data.</text>
        </g>
        

    <!-- Left Side: Quote Box -->
    <g transform="translate(60, 440)">
        <rect x="0" y="0" width="4" height="34" fill="#818CF8" rx="2" />
        <text x="16" y="16" font-family="'Inter', sans-serif" font-style="italic" font-size="12" fill="#CBD5E1">"Silent model degradation is far deadlier than a service crash."</text>
        <text x="16" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">PRODUCTION BEST PRACTICE</text>
    </g>

    <!-- Left Side: Tag Pills -->
    
        <rect x="60" y="490" width="106" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
        <text x="73" y="506" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7DD3FC">• ModelDrift</text>
        
        <rect x="176" y="490" width="106" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
        <text x="189" y="506" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7DD3FC">• Statistics</text>
        
        <rect x="292" y="490" width="66" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
        <text x="305" y="506" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7DD3FC">• MLOps</text>
        
        <rect x="368" y="490" width="50" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
        <text x="381" y="506" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7DD3FC">• PSI</text>
        

    <!-- Right Side: Terminal / Metrics Window Container -->
    <g transform="translate(640, 190)">
        <!-- Outer Window Box -->
        <rect width="500" height="330" rx="16" fill="#090E17" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5" />
        
        <!-- Header Bar -->
        <rect width="500" height="42" rx="16" fill="#0F172A" />
        <rect y="26" width="500" height="16" fill="#0F172A" /> <!-- Flatten bottom corners -->
        <line x1="0" y1="42" x2="500" y2="42" stroke="#1E293B" stroke-width="1" />

        <!-- Window Controls -->
        <circle cx="24" cy="21" r="5" fill="#EF4444" />
        <circle cx="40" cy="21" r="5" fill="#F59E0B" />
        <circle cx="56" cy="21" r="5" fill="#10B981" />

        <text x="76" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">drift-monitor.py</text>

